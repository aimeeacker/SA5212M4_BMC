# Detailed documentation: docs/FAN_CONTROL.md

# Primary idle upper temperature limit in Celsius (50-70, shifts entire thermal curve)
idle_upper_temp = 68

# Cold ambient threshold in Celsius to trigger deep sleep fan speed
cold_ambient_temp = 48

# Temperature sampling and PID control evaluation interval in seconds
check_interval = 30

# Temperature hysteresis margin in Celsius to prevent fan speed oscillation
hysteresis_c = 2

# Fan speed acceleration and deceleration step percentages [ramp_up_step, ramp_down_step]
ramp_steps = 2, 1

# Hardware fan channel indices [main_channel, cpu0_channel, cpu1_channel]
fan_channels = 2, 4, 0

# Primary fan target speed percentages [normal_idle, cold_idle]
fan_main_speeds = 16, 6

# Offset percentage deducted from primary fan speed for auxiliary fans Fan 0 and Fan 4
fan_aux_offset = 15

# Absolute standby floor speed percentage for auxiliary fans and Fan 6
fan_standby_floor = 1

# Hardware fan duty cycle limits [min_percent, max_percent]
fan_limits = 1, 100

# Bitmask of fan channels to disable without triggering alarms (e.g. 64 for Fan 6)
disabled_fan_mask = 0

# Maximum allowable fan speed differential percentage between adjacent cooling zones
max_fan_delta = 30

# SDR sensor IDs for CPU temperature readings [cpu0_sdr, cpu1_sdr]
cpu_sensors = 0x19, 0x1a

# Failsafe fan duty cycle percentage applied upon continuous sensor reading failures
sensor_fail_safe_speed = 50

# Logging verbosity level (0: errors only, 1: status changes, 2: verbose polling)
log_level = 1

# Thermal curve matrix [temp_offset:speed_percent] for Levels 0 to 5 relative to idle_upper_temp
thermal_curve = 0:16, 3:20, 6:22, 12:28, 18:40, +:70
